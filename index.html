<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raf Matos — Remodelações Interior e Exterior</title>
  <meta name="description" content="Raf Matos — remodelações e construção civil em Vila Nova de Gaia. Pladur, tijoleira, pintura, telhados, canalização e eletricidade." />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/barlow-700.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-var.woff2" crossorigin />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
</head>
<body>
  <main id="conteudo">
    <section class="section">
      <div class="container">
        <span class="eyebrow">Prova de design · Bloco 1</span>
        <h1 class="section-title">Transformamos ideias em <span class="text-blue">realidade</span>.</h1>
        <p class="section-lead">Remodelações interior e exterior — qualidade, profissionalismo e atenção aos detalhes.</p>
        <div style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.6rem">
          <a class="btn btn--primary btn--lg" href="#">Pedir orçamento</a>
          <a class="btn btn--blue btn--lg" href="#">Azul</a>
          <a class="btn btn--dark" href="#">Navy</a>
          <a class="btn btn--outline" href="#">Contorno</a>
          <a class="btn btn--wa" href="#">WhatsApp</a>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:1.8rem">
          <span style="width:120px;height:74px;border-radius:12px;background:var(--blue);color:#fff;display:flex;align-items:end;padding:8px;font:700 .8rem var(--font-head)">#0B57A4</span>
          <span style="width:120px;height:74px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:end;padding:8px;font:700 .8rem var(--font-head)">#08356B</span>
          <span style="width:120px;height:74px;border-radius:12px;background:var(--yellow);color:var(--ink);display:flex;align-items:end;padding:8px;font:700 .8rem var(--font-head)">#F2B50A</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
